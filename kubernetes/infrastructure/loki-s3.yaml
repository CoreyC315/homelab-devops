# Hardening plan P9: standalone Loki, Monolithic mode.
# 2026-11-16: storage moved S3 (MinIO) -> filesystem on the Longhorn PVC when MinIO
# was retired (MinIO images became unpullable). ~80MB/day of chunks -> 30d fits in 10Gi.
# (File name kept as loki-s3.yaml so the Argo Application isn't re-created.)
# Chart 17.4.11 from grafana-community — NOT grafana.github.io, whose `loki`
# chart was re-versioned to the Enterprise Logs lineage (7.x); pinning from
# there would deploy the wrong product (verified 2026-08-14).
# Greenfield: the old loki-stack was already gone (June consolidation) — no
# parallel-run/retirement needed (P11 shrank accordingly).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  source:
    chart: loki
    repoURL: https://grafana-community.github.io/helm-charts
    targetRevision: 17.4.11 # appVersion grafana/loki:3.7.2
    helm:
      releaseName: loki
      values: |
        deploymentMode: Monolithic
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          schemaConfig:
            configs:
              - from: "2026-06-01" # pre-dates every live pod's log start — long-running pods replay old lines and Loki 500-drops whole batches whose entries precede the schema (bit us live: teyvat-hardening-execution-log P15)
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
          storage:
            type: filesystem
          limits_config:
            retention_period: 720h # 30d
            allow_structured_metadata: true
            volume_enabled: true
          # Retention lives under loki.compactor (config passthrough) — the
          # chart's TOP-LEVEL compactor: block is only the pod spec for the
          # microservices mode and has no retention keys.
          compactor:
            retention_enabled: true
            delete_request_store: filesystem
        singleBinary:
          replicas: 1
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi
          persistence:
            enableStatefulSetAutoDeletePVC: false
            size: 10Gi
            storageClass: longhorn
        # Chart validation REQUIRES these at 0 in Monolithic mode (they
        # default to 3 and the render fails otherwise).
        write:
          replicas: 0
        read:
          replicas: 0
        backend:
          replicas: 0
        # Homelab diet: the defaults ship ~9GB of memcached + a canary.
        chunksCache:
          enabled: false
        resultsCache:
          enabled: false
        lokiCanary:
          enabled: false
        test:
          enabled: false # helm test needs the canary
        gateway:
          enabled: false # plan decision #6 (avoids Monolithic-gateway 502s)
        minio:
          enabled: false
  destination:
    server: "https://kubernetes.default.svc"
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
