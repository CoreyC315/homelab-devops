# Hardening plan P9: standalone Loki, Monolithic mode, S3 (MinIO) backend.
# Chart 17.4.11 from grafana-community — NOT grafana.github.io, whose `loki`
# chart was re-versioned to the Enterprise Logs lineage (7.x); pinning from
# there would deploy the wrong product (verified 2026-08-14).
# Greenfield: the old loki-stack was already gone (June consolidation) — no
# parallel-run/retirement needed (P11 shrank accordingly).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  source:
    chart: loki
    repoURL: https://grafana-community.github.io/helm-charts
    targetRevision: 17.4.11 # appVersion grafana/loki:3.7.2
    helm:
      releaseName: loki
      values: |
        deploymentMode: Monolithic
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          schemaConfig:
            configs:
              - from: "2026-08-14" # fresh store, no migration (old logs gone with loki-stack)
                store: tsdb
                object_store: s3
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
          storage:
            type: s3
            # REQUIRED by the chart's helpers (not documented in values.yaml,
            # enforced by _helpers.tpl) — both may share one bucket.
            bucketNames:
              chunks: loki
              ruler: loki
            s3:
              endpoint: http://minio.minio.svc.cluster.local:9000
              # -config.expand-env=true is hardcoded in the chart's pod args,
              # so ${VAR} expands from the extraEnvFrom secret below.
              accessKeyId: ${AWS_ACCESS_KEY_ID}
              secretAccessKey: ${AWS_SECRET_ACCESS_KEY}
              s3ForcePathStyle: true
              insecure: true
          limits_config:
            retention_period: 720h # 30d
            allow_structured_metadata: true
            volume_enabled: true
          # Retention lives under loki.compactor (config passthrough) — the
          # chart's TOP-LEVEL compactor: block is only the pod spec for the
          # microservices mode and has no retention keys.
          compactor:
            retention_enabled: true
            delete_request_store: s3
        singleBinary:
          replicas: 1
          extraEnvFrom:
            - secretRef:
                name: minio-s3-creds # SOPS: kubernetes/secrets/observability-s3-creds.sops.yaml
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi
          persistence:
            enableStatefulSetAutoDeletePVC: false
            size: 10Gi
            storageClass: longhorn
        # Chart validation REQUIRES these at 0 in Monolithic mode (they
        # default to 3 and the render fails otherwise).
        write:
          replicas: 0
        read:
          replicas: 0
        backend:
          replicas: 0
        # Homelab diet: the defaults ship ~9GB of memcached + a canary.
        chunksCache:
          enabled: false
        resultsCache:
          enabled: false
        lokiCanary:
          enabled: false
        test:
          enabled: false # helm test needs the canary
        gateway:
          enabled: false # plan decision #6 (avoids Monolithic-gateway 502s)
        minio:
          enabled: false # we bring our own
  destination:
    server: "https://kubernetes.default.svc"
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
