apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  project: default
  source:
    chart: longhorn
    repoURL: https://charts.longhorn.io
    targetRevision: 1.7.2 # Use the latest stable version
    helm:
      values: |
        preUpgradeChecker:
          jobEnabled: false
        persistence:
          # 2 storage workers since raiden was retired (2026-07) — a count of 3
          # births permanently-degraded volumes. Bump only when a 3rd Longhorn
          # node exists (pneuma is taint-excluded from Longhorn on purpose).
          defaultClassReplicaCount: 2
        defaultSettings:
          replicaNodeSoftAntiAffinity: false
          nodeDrainPolicy: allow-if-replica-is-stopped
        # P7: nginx retired — longhorn.local now served by the shared Gateway
        # (HTTPRoute in kubernetes/apps/gateway/httproute-longhorn.yaml).
        ingress:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
