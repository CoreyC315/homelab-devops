apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  project: default
  source:
    chart: longhorn
    repoURL: https://charts.longhorn.io
    # Longhorn only upgrades one minor at a time and blocks downgrades:
    # step through the latest patch of each minor (1.7 -> 1.8 -> ... -> 1.13).
    targetRevision: 1.13.0
    helm:
      values: |
        preUpgradeChecker:
          jobEnabled: false
        persistence:
          # 2 storage workers since raiden was retired (2026-07) — a count of 3
          # births permanently-degraded volumes. Bump only when a 3rd Longhorn
          # node exists (pneuma is taint-excluded from Longhorn on purpose).
          defaultClassReplicaCount: 2
        defaultSettings:
          replicaNodeSoftAntiAffinity: false
          nodeDrainPolicy: allow-if-replica-is-stopped
          # Live-upgrade volume engines after each Longhorn upgrade (one per
          # node at a time); otherwise they stay on the old engine image until
          # a newer manager no longer supports it.
          concurrentAutomaticEngineUpgradePerNodeLimit: 1
        # v1.12.1+ ships 6 internal NetworkPolicies by default. kube-router
        # enforces them, kube-router isn't in Longhorn's validated CNI list, and
        # glance reads Longhorn cross-namespace. Keep pre-1.12 behaviour (no
        # policies); enabling them should be its own tested change.
        networkPolicies:
          restrictInternalTraffic: false
        # P7: nginx retired — longhorn.local now served by the shared Gateway
        # (HTTPRoute in kubernetes/apps/gateway/httproute-longhorn.yaml).
        ingress:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
