# Hardening plan P4: Envoy Gateway control plane. v1.8.3 = latest stable,
# k8s 1.32-1.35 in the support matrix (k0s here is 1.35.2), data plane
# envoy distroless-v1.38.0, tested against Gateway API v1.5.1 (which is
# exactly what gateway-api-crds.yaml vendors).
# crds.enabled=false — CRDs come from gateway-api-crds + envoy-gateway-crds
# Applications (single-owner rule; also avoids the chart's helm-lookup-based
# safe-upgrade VAP misbehaving under ArgoCD's template rendering).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  project: default
  source:
    chart: gateway-helm
    repoURL: docker.io/envoyproxy # OCI registry
    targetRevision: v1.8.3
    helm:
      releaseName: envoy-gateway
      values: |
        crds:
          enabled: false
  destination:
    server: "https://kubernetes.default.svc"
    namespace: envoy-gateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
