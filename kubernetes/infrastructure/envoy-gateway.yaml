# Hardening plan P4: Envoy Gateway control plane. Matrix-matched trio:
# EG version <-> envoy data-plane image (kubernetes/apps/gateway/envoyproxy.yaml)
# <-> Gateway API CRDs (gateway-api-crds.yaml). EG 1.9/1.10 need Gateway API
# v1.6; bump CRDs first, then this + envoy-gateway-crds + the envoy pin.
# crds.enabled=false — CRDs come from gateway-api-crds + envoy-gateway-crds
# Applications (single-owner rule; also avoids the chart's helm-lookup-based
# safe-upgrade VAP misbehaving under ArgoCD's template rendering).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  project: default
  source:
    chart: gateway-helm
    repoURL: docker.io/envoyproxy # OCI registry
    targetRevision: v1.10.0
    helm:
      releaseName: envoy-gateway
      values: |
        crds:
          enabled: false
  destination:
    server: "https://kubernetes.default.svc"
    namespace: envoy-gateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
