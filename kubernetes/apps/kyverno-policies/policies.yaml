# P13: the 5 hand-written ClusterPolicies (plan decision #13 — no chart dep).
# ALL Audit — Enforce graduates per-namespace only after the PolicyReport
# soak shows a namespace clean (plan decision #12, locked). Kyverno 1.18
# syntax: failureAction under validate (validationFailureAction deprecated).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
spec:
  background: true
  rules:
    - name: require-image-tag
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        failureAction: Audit
        # 2026-08-25: Enforce overrides reverted to Audit everywhere (owner
        # request) — Enforce had a history of blocking pod recreation during
        # incidents (see 2026-08-18 probes note). Re-graduate per-namespace
        # after another clean soak.
        message: "Images must use a pinned tag, not :latest/:main (floating tags break reproducibility and rollback)."
        foreach:
          - list: "request.object.spec.containers[]"
            deny:
              conditions:
                any:
                  - key: "{{ element.image }}"
                    operator: Equals
                    value: "*:latest"
                  - key: "{{ element.image }}"
                    operator: Equals
                    value: "*:main"
                  - key: "{{ contains(element.image, ':') }}"
                    operator: Equals
                    value: false
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-limits-and-requests
spec:
  background: true
  rules:
    - name: require-container-resources
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        failureAction: Audit
        # 2026-08-25: Enforce reverted to Audit (owner request, see above).
        message: "Every container needs resource requests AND limits (CPU-spike outage history on this cluster)."
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    memory: "?*"
                    cpu: "?*"
                  limits:
                    memory: "?*"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-pod-probes
spec:
  background: true
  rules:
    - name: require-liveness-readiness
      match:
        any:
          - resources:
              kinds: [Pod]
              # CREATE/UPDATE only: on DELETE `object` is null and the CEL
              # rule errors ("no such key: spec"), which with a fail-closed
              # webhook blocked pod DELETION in the Enforce'd namespaces.
              operations: [CREATE, UPDATE]
      exclude:
        any:
          - resources:
              kinds: [Pod]
              selector:
                matchLabels:
                  batch.kubernetes.io/job-name: "*"
      validate:
        failureAction: Audit
        # 2026-08-25: Enforce reverted to Audit (owner request, see above) —
        # this policy blocked jellyfin/seerr recreation on 2026-08-18.
        message: "Long-running containers need liveness + readiness probes."
        # 2026-08-18: was `pattern: containers: [- livenessProbe: "?*" ...]`.
        # After the 3.8.2 (v1.18.2) upgrade that pattern denies pods that DO
        # have both probes (`?*` no longer matches object-valued fields) —
        # it blocked jellyfin/seerr recreation after a node reboot. CEL is
        # unambiguous about "field exists".
        cel:
          expressions:
            - expression: >-
                object.spec.containers.all(c,
                has(c.livenessProbe) && has(c.readinessProbe))
              message: "Long-running containers need liveness + readiness probes."
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privilege-escalation
spec:
  background: true
  rules:
    - name: deny-privilege-escalation
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        failureAction: Audit
        # 2026-08-25: Enforce reverted to Audit (owner request, see above).
        message: "allowPrivilegeEscalation must be false."
        pattern:
          spec:
            =(initContainers):
              - =(securityContext):
                  =(allowPrivilegeEscalation): "false"
            containers:
              - =(securityContext):
                  =(allowPrivilegeEscalation): "false"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-run-as-nonroot
spec:
  background: true
  rules:
    - name: run-as-non-root
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        failureAction: Audit
        message: "Pods should run as non-root (pod or container level runAsNonRoot: true)."
        anyPattern:
          - spec:
              securityContext:
                runAsNonRoot: true
          - spec:
              containers:
                - securityContext:
                    runAsNonRoot: true
