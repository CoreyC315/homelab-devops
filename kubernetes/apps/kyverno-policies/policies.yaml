# P13: the 5 hand-written ClusterPolicies (plan decision #13 — no chart dep).
# ALL Audit — Enforce graduates per-namespace only after the PolicyReport
# soak shows a namespace clean (plan decision #12, locked). Kyverno 1.18
# syntax: failureAction under validate (validationFailureAction deprecated).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
spec:
  background: true
  rules:
    - name: require-image-tag
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        failureAction: Audit
        message: "Images must use a pinned tag, not :latest/:main (floating tags break reproducibility and rollback)."
        foreach:
          - list: "request.object.spec.containers[]"
            deny:
              conditions:
                any:
                  - key: "{{ element.image }}"
                    operator: Equals
                    value: "*:latest"
                  - key: "{{ element.image }}"
                    operator: Equals
                    value: "*:main"
                  - key: "{{ contains(element.image, ':') }}"
                    operator: Equals
                    value: false
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-limits-and-requests
spec:
  background: true
  rules:
    - name: require-container-resources
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        failureAction: Audit
        message: "Every container needs resource requests AND limits (CPU-spike outage history on this cluster)."
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    memory: "?*"
                    cpu: "?*"
                  limits:
                    memory: "?*"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-pod-probes
spec:
  background: true
  rules:
    - name: require-liveness-readiness
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              kinds: [Pod]
              selector:
                matchLabels:
                  batch.kubernetes.io/job-name: "*"
      validate:
        failureAction: Audit
        message: "Long-running containers need liveness + readiness probes."
        pattern:
          spec:
            containers:
              - livenessProbe: "?*"
                readinessProbe: "?*"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privilege-escalation
spec:
  background: true
  rules:
    - name: deny-privilege-escalation
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        failureAction: Audit
        # Graduated 2026-08-16 after 2-day soak: ZERO violations in every app
        # namespace -- Enforce is free here. System namespaces stay Audit.
        failureActionOverrides:
          - action: Enforce
            namespaces: [default, ai-stack, glance, homelable, observability, minio, velero]
        message: "allowPrivilegeEscalation must be false."
        pattern:
          spec:
            =(initContainers):
              - =(securityContext):
                  =(allowPrivilegeEscalation): "false"
            containers:
              - =(securityContext):
                  =(allowPrivilegeEscalation): "false"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-run-as-nonroot
spec:
  background: true
  rules:
    - name: run-as-non-root
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        failureAction: Audit
        message: "Pods should run as non-root (pod or container level runAsNonRoot: true)."
        anyPattern:
          - spec:
              securityContext:
                runAsNonRoot: true
          - spec:
              containers:
                - securityContext:
                    runAsNonRoot: true
