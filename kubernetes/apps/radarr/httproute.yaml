# P6: HTTPRoute derived 1:1 from live Ingress default/radarr-ingress (hosts + backend parity).
# Legacy Ingress stays until P7 commit 3.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radarr
  namespace: default
spec:
  parentRefs:
    - name: teyvat-gateway
      namespace: envoy-gateway-system
  hostnames:
    - radarr.local
    - radarr.lan
  rules:
    - backendRefs:
        - name: radarr
          port: 7878
      # Interactive/season searches can take 60s+; Envoy's 15s default 504s them.
      timeouts:
        request: 300s
