apiVersion: apps/v1
kind: Deployment
metadata:
  name: seerr
spec:
  replicas: 1
  # RWO Longhorn config volume: Recreate avoids a rolling-update deadlock where
  # the new pod can't attach the volume still held by the old pod.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: seerr
  template:
    metadata:
      labels:
        app: seerr
    spec:
      # Pinned to aether-worker: single-node consolidation 2026-06-13. nahida
      # is powered off, so keep seerr (and its Longhorn replica) on the only
      # live worker.
      nodeSelector:
        kubernetes.io/hostname: "aether-worker"
      # Seerr v3 runs as the image's `node` user (UID/GID 1000) and ignores
      # PUID/PGID. The config PVC was written as root by Jellyseerr 2.x, so
      # fsGroup re-groups it to 1000 with group rw on first mount.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      # The image has no init process (upstream recommends docker --init);
      # the shared pause container reaps zombies instead.
      shareProcessNamespace: true
      containers:
        - name: seerr
          # Jellyseerr -> Seerr (merged Overseerr/Jellyseerr project). The DB and
          # settings migrate in place on first start (one-way); rollback =
          # Longhorn snapshot seerr-pre-v3-migration (2026-11-10).
          image: ghcr.io/seerr-team/seerr:v3.5.1
          ports:
            - containerPort: 5055
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: 5055
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5055
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: config
              mountPath: /app/config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: seerr-config-pvc
