# P6: HTTPRoute from live Ingress default/seerr-ingress. DELIBERATE DELTA:
# the Ingress says port 5055 but the Service only exposes 80->5055; nginx
# tolerated the mismatch, Gateway API correctly rejects it (PortNotFound).
# Legacy Ingress stays until P7 commit 3.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seerr
  namespace: default
spec:
  parentRefs:
    - name: teyvat-gateway
      namespace: envoy-gateway-system
  hostnames:
    - seerr.local
    - seerr.lan
  rules:
    - backendRefs:
        - name: seerr
          port: 80
