# P6: HTTPRoute derived 1:1 from live Ingress default/seerr-ingress (hosts + backend parity).
# Legacy Ingress stays until P7 commit 3.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seerr
  namespace: default
spec:
  parentRefs:
    - name: teyvat-gateway
      namespace: envoy-gateway-system
  hostnames:
    - seerr.local
    - seerr.lan
  rules:
    - backendRefs:
        - name: seerr
          port: 5055
