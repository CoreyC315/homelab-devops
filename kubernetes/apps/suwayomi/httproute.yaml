# P6: HTTPRoute from live Ingress default/suwayomi-ingress. DELIBERATE DELTA:
# Ingress says port 4567, Service exposes 80->4567 (see seerr note).
# Legacy Ingress stays until P7 commit 3.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: suwayomi
  namespace: default
spec:
  parentRefs:
    - name: teyvat-gateway
      namespace: envoy-gateway-system
  hostnames:
    - suwayomi.local
    - suwayomi.lan
  rules:
    - backendRefs:
        - name: suwayomi
          port: 80
