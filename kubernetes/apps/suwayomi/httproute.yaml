# P6: HTTPRoute derived 1:1 from live Ingress default/suwayomi-ingress (hosts + backend parity).
# Legacy Ingress stays until P7 commit 3.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: suwayomi
  namespace: default
spec:
  parentRefs:
    - name: teyvat-gateway
      namespace: envoy-gateway-system
  hostnames:
    - suwayomi.local
    - suwayomi.lan
  rules:
    - backendRefs:
        - name: suwayomi
          port: 4567
