# P6: HTTPRoute derived 1:1 from live Ingress default/prowlarr-ingress (hosts + backend parity).
# Legacy Ingress stays until P7 commit 3.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prowlarr
  namespace: default
spec:
  parentRefs:
    - name: teyvat-gateway
      namespace: envoy-gateway-system
  hostnames:
    - prowlarr.local
    - prowlarr.lan
  rules:
    - backendRefs:
        - name: prowlarr
          port: 9696
