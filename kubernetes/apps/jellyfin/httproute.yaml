# P6: HTTPRoute derived 1:1 from live Ingress default/jellyfin-ingress (hosts + backend parity).
# Legacy Ingress stays until P7 commit 3.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin
  namespace: default
spec:
  parentRefs:
    - name: teyvat-gateway
      namespace: envoy-gateway-system
  hostnames:
    - jellyfin.lan
    - jellyfin.local
  rules:
    - backendRefs:
        - name: jellyfin-service
          port: 80
---
# Hostless catch-all: bare-IP / SNI-less clients (Jellyfin mobile app).
# Specific hostnames on other routes win first per Gateway API precedence.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin-catchall
  namespace: default
spec:
  parentRefs:
    - name: teyvat-gateway
      namespace: envoy-gateway-system
  rules:
    - backendRefs:
        - name: jellyfin-service
          port: 80
