# P6: HTTPRoute derived 1:1 from live Ingress glance/glance (hosts + backend parity).
# Legacy Ingress stays until P7 commit 3.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: glance
  namespace: glance
spec:
  parentRefs:
    - name: teyvat-gateway
      namespace: envoy-gateway-system
  hostnames:
    - glance.local
    - glance.lan
  rules:
    - backendRefs:
        - name: glance
          port: 80
