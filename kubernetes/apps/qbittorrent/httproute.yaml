# P6: HTTPRoute derived 1:1 from live Ingress default/qbittorrent-ingress (hosts + backend parity).
# Legacy Ingress stays until P7 commit 3.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qbittorrent
  namespace: default
spec:
  parentRefs:
    - name: teyvat-gateway
      namespace: envoy-gateway-system
  hostnames:
    - qbit.local
    - qbit.lan
  rules:
    - backendRefs:
        - name: qbittorrent
          port: 8080
