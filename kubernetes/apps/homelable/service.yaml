apiVersion: v1
kind: Service
metadata:
  # Named "backend" (not "homelable-backend") because the frontend image's
  # baked-in nginx config hardcodes an upstream literally named "backend"
  # (carried over from the upstream docker-compose service name).
  name: backend
  namespace: homelable
spec:
  selector:
    app: homelable-backend
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: homelable-frontend
  namespace: homelable
spec:
  selector:
    app: homelable-frontend
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: homelable-mcp
  namespace: homelable
spec:
  selector:
    app: homelable-mcp
  ports:
    - port: 8001
      targetPort: 8001
