# P6: HTTPRoute derived 1:1 from live Ingress homelable/homelable (hosts + backend parity).
# Legacy Ingress stays until P7 commit 3.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homelable
  namespace: homelable
spec:
  parentRefs:
    - name: teyvat-gateway
      namespace: envoy-gateway-system
  hostnames:
    - homelable.local
    - homelable.lan
  rules:
    - backendRefs:
        - name: homelable-frontend
          port: 80
