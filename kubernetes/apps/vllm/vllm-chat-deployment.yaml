apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-chat
  namespace: ai-stack
  labels:
    app: vllm-chat
    app.kubernetes.io/part-of: vllm
spec:
  # NOTE: .spec.replicas intentionally omitted — KEDA owns it (ScaledObject,
  # min 0 / max 1). The vllm Application carries ignoreDifferences for it.
  strategy:
    type: Recreate # single GPU — a rolling update would deadlock on nvidia.com/gpu
  selector:
    matchLabels:
      app: vllm-chat
  template:
    metadata:
      labels:
        app: vllm-chat
        app.kubernetes.io/part-of: vllm
        teyvat.io/gpu-workload: "true"
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: ousia
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      # vllm-openai's image runs as root by default (common for CUDA images) —
      # Kyverno's require-run-as-nonroot caught this in audit. UID/GID 1000
      # chosen to match /var/lib/vllm-models' ownership on ousia (chowned
      # 2026-08-17); fsGroup covers the emptyDir shm mount too. GPU access via
      # the nvidia CDI runtime doesn't depend on the container's UID.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.8.4
          args:
            - --model=Qwen/Qwen2.5-32B-Instruct-AWQ # awq_marlin auto-detected
            - --served-model-name=qwen2.5-32b
            - --max-model-len=12288
            # ousia's 3090 is dedicated (no desktop/subgen sharing it like
            # pneuma's did) — 0.90 leaves ~2.4GB headroom for CUDA/KV-cache
            # bookkeeping above the ~16-18GB AWQ weights.
            - --gpu-memory-utilization=0.97
            # Halved from pneuma's 8: less spare VRAM for concurrent KV-cache
            # at 32B vs. the old 14B, so cap concurrency lower to start.
            - --max-num-seqs=4
          env:
            - name: HF_HOME
              value: /models/hf
            - name: VLLM_CACHE_ROOT # persist torch.compile cache across cold starts
              value: /models/vllm-cache
            # Non-root fix, part 2: the image's /etc/passwd has no entry for
            # UID 1000, and vLLM's startup path calls getpass.getuser() ->
            # pwd.getpwuid() during model registry inspection, which throws
            # KeyError without this. Setting USER short-circuits getuser()
            # before it ever reaches the passwd lookup — confirmed via a
            # real cold-start test 2026-08-17, not just spec-applied.
            - name: USER
              value: vllm
            # Non-root fix, part 3: no /etc/passwd entry also means no
            # resolvable home dir, so os.path.expanduser("~") returns "" and
            # FlashInfer's JIT cache (FLASHINFER_WORKSPACE_DIR, defaults to
            # ~/.cache/flashinfer) tries to write to the literal path
            # "/.cache" — PermissionError on the read-only container root.
            # Point HOME at the already-writable /models mount so this (and
            # anything else that follows $HOME/.cache) persists across
            # restarts like VLLM_CACHE_ROOT already does.
            - name: HOME
              value: /models
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              # ousia is 30GiB RAM as of the 2026-08-17 rebalance (was
              # ~11.6GiB). Limits kept as-is for now — real headroom exists
              # to raise these if concurrency needs grow.
              cpu: "2"
              memory: 6Gi
              nvidia.com/gpu: 1
            limits:
              cpu: "6"
              memory: 9Gi
              nvidia.com/gpu: 1
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            # 30 min: model load + engine init, with margin for a full
            # re-download if the hostPath cache is ever wiped.
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: models
              mountPath: /models
            - name: shm
              mountPath: /dev/shm
      volumes:
        # Node-local NVMe cache, matches the pneuma precedent — contents are
        # re-downloadable, no need for Longhorn replication.
        - name: models
          hostPath:
            path: /var/lib/vllm-models
            type: DirectoryOrCreate
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
