apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-coder
  namespace: ai-stack
  labels:
    app: vllm-coder
    app.kubernetes.io/part-of: vllm
spec:
  # NOTE: .spec.replicas intentionally omitted — KEDA owns it (ScaledObject,
  # min 0 / max 1). The vllm Application carries ignoreDifferences for it.
  strategy:
    type: Recreate # single GPU — a rolling update would deadlock on nvidia.com/gpu
  selector:
    matchLabels:
      app: vllm-coder
  template:
    metadata:
      labels:
        app: vllm-coder
        app.kubernetes.io/part-of: vllm
        teyvat.io/gpu-workload: "true"
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: ousia
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      # See vllm-chat-deployment.yaml — same non-root fix, same UID/GID
      # (matches /var/lib/vllm-models ownership on ousia).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.8.4
          args:
            - --model=Qwen/Qwen2.5-Coder-32B-Instruct-AWQ # awq_marlin auto-detected
            - --served-model-name=qwen2.5-coder-32b
            - --max-model-len=12288
            - --gpu-memory-utilization=0.97
            - --max-num-seqs=4
          env:
            - name: HF_HOME
              value: /models/hf
            - name: VLLM_CACHE_ROOT
              value: /models/vllm-cache
            # See vllm-chat-deployment.yaml — same getpass.getuser() fix.
            - name: USER
              value: vllm
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              # ousia is 30GiB RAM as of the 2026-08-17 rebalance.
              cpu: "2"
              memory: 6Gi
              nvidia.com/gpu: 1
            limits:
              cpu: "6"
              memory: 9Gi
              nvidia.com/gpu: 1
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: models
              mountPath: /models
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: models
          hostPath:
            path: /var/lib/vllm-models
            type: DirectoryOrCreate
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
