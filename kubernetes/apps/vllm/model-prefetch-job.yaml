# One-off warm-cache pull so the first real request doesn't eat a 15-20min
# HF download on top of KEDA's cold-start window. Re-run manually (delete +
# reapply, Jobs aren't mutable) if the model list changes.
apiVersion: batch/v1
kind: Job
metadata:
  name: vllm-model-prefetch
  namespace: ai-stack
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: vllm
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: ousia
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: prefetch
          image: python:3.12-slim
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              pip install -q -U huggingface_hub
              # huggingface-cli was dropped in huggingface_hub 1.x — the
              # unified CLI is now `hf`. hf_transfer is also gone, replaced
              # by Xet (on by default). --max-workers 1 keeps concurrent
              # download/reconstruction buffers low — ousia's node RAM is
              # ~11.6GiB (Phase 0 sizing not yet applied), default
              # max-workers=8 OOMKilled this job outright at both 4Gi and
              # 8Gi container limits.
              hf download Qwen/Qwen2.5-32B-Instruct-AWQ --max-workers 1
              # Re-added 2026-08-11: ousia's disk was resized 60G -> 200G on
              # furina (qm resize + growpart + resize2fs), which is what the
              # Phase 0 plan called for in the first place. Two 32B-class
              # AWQ checkpoints (~26GB each) plus the vllm-openai image and
              # OS now fit comfortably (~85GB of 197GB).
              hf download Qwen/Qwen2.5-Coder-32B-Instruct-AWQ --max-workers 1
              echo "prefetch complete"
          env:
            - name: HF_HOME
              value: /models/hf
            # Explicitly OFF: HF's own docs say this mode needs 64GB+ RAM —
            # exactly what caused the OOM here at 8Gi. Do not re-enable
            # without a lot more headroom than ousia currently has.
            - name: HF_XET_HIGH_PERFORMANCE
              value: "0"
            # Both models are ungated/public — no token required. If a gated
            # model is ever added here, create litellm-secret-style
            # 'hf-token' secret out-of-band and uncomment below.
            # - name: HF_TOKEN
            #   valueFrom:
            #     secretKeyRef:
            #       name: hf-token
            #       key: HF_TOKEN
            #       optional: true
          resources:
            requests:
              cpu: "1"
              memory: 3Gi
            limits:
              cpu: "2"
              # OOMKilled at 4Gi in practice — download/verification buffers
              # need more than that. No vLLM pod is competing for RAM during
              # prefetch (KEDA has both scaled to 0), so there's headroom on
              # ousia's constrained ~11.6GiB node even at 8Gi.
              memory: 8Gi
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          hostPath:
            path: /var/lib/vllm-models
            type: DirectoryOrCreate
