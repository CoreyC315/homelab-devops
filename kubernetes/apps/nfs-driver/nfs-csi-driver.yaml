apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nfs-csi-driver
  namespace: argocd
spec:
  project: default
  source:
    chart: csi-driver-nfs
    repoURL: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts
    targetRevision: v4.9.0
    helm:
      values: |
        kubeletDir: /var/lib/k0s/kubelet
        # 2026-08-25: chart-default 300Mi limit OOM-killed the node plugin on
        # nahida mid-mount, wedging the kernel NFS client (node reboot required).
        node:
          resources:
            nfs:
              limits:
                memory: 1Gi
              requests:
                cpu: 10m
                memory: 20Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system # Drivers should live here for system-level access
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
