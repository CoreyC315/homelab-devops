# P6: HTTPRoute derived 1:1 from live Ingress longhorn-system/longhorn-ingress (hosts + backend parity).
# Legacy Ingress stays until P7 commit 3.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  parentRefs:
    - name: teyvat-gateway
      namespace: envoy-gateway-system
  hostnames:
    - longhorn.local
    - longhorn.lan
  rules:
    - backendRefs:
        - name: longhorn-frontend
          port: 80
