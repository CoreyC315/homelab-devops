# P8: MinIO console via the shared Gateway. NOTE: minio.local/.lan need
# Pi-hole entries pointing at 192.168.1.50 before these hostnames resolve
# from LAN clients (new names — flagged to owner in the execution log).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: minio-console
  namespace: minio
spec:
  parentRefs:
    - name: teyvat-gateway
      namespace: envoy-gateway-system
  hostnames:
    - minio.local
    - minio.lan
  rules:
    - backendRefs:
        - name: minio-console
          port: 9001
