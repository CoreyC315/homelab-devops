apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
spec:
  replicas: 1  # restored 2026-06-15 — full cluster back online (un-consolidated)
  strategy:
    type: Recreate  # config PVC is Longhorn RWO — rolling update multi-attaches across nodes
  selector:
    matchLabels:
      app: sonarr
  template:
    metadata:
      labels:
        app: sonarr
    spec:
      containers:
        - name: sonarr
          # v5 pre-release since 2026-11-09 (one-way DB migration). Roll back to
          # 4.0.19.2979-ls319 via Sonarr backup sonarr_backup_v4.0.19.2979_2026.11.09_20.52.03.zip
          # or Longhorn snapshot sonarr-pre-v5-20261109.
          image: lscr.io/linuxserver/sonarr:develop-5.0.0.2941-ls208
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          ports:
            - containerPort: 8989
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: 8989
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8989
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data # Shared TrueNAS mount
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: sonarr-config-pvc
        - name: data
          persistentVolumeClaim:
            claimName: irminsul-records-celestia-pvc
