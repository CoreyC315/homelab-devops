# P6: HTTPRoute derived 1:1 from live Ingress argocd/argocd-server-ingress (hosts + backend parity).
# Legacy Ingress stays until P7 commit 3.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: teyvat-gateway
      namespace: envoy-gateway-system
  hostnames:
    - argo.local
    - argo.lan
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
