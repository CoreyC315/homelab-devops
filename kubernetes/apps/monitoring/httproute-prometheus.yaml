# P6: HTTPRoute derived 1:1 from live Ingress monitoring/kube-prometheus-stack-prometheus (hosts + backend parity).
# Legacy Ingress stays until P7 commit 3.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
  namespace: monitoring
spec:
  parentRefs:
    - name: teyvat-gateway
      namespace: envoy-gateway-system
  hostnames:
    - prometheus.local
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-prometheus
          port: 9090
