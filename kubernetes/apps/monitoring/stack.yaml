apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    chart: kube-prometheus-stack
    repoURL: https://prometheus-community.github.io/helm-charts
    # Fresh install 2026-07-02 (the previous 61.3.2 install was deleted live
    # during the June consolidation and was never GitOps-managed). Installing
    # current stable directly also satisfies hardening-plan Phase 11 early.
    targetRevision: 87.5.1
    helm:
      releaseName: kube-prometheus-stack
      values: |
        # RAM Saving configs for Homelab
        # k0s runs kube-scheduler and kube-controller-manager as plain
        # processes on the master (bind 127.0.0.1), and the master is not a
        # kubelet node — Prometheus can never scrape them, so the chart's
        # KubeSchedulerDown/KubeControllerManagerDown criticals fire forever
        # (they paged ntfy every 12h through 2026-08-15..18 while the real
        # incident was an apiserver OOM). Disable the components entirely.
        kubeScheduler:
          enabled: false
        kubeControllerManager:
          enabled: false
        alertmanager:
          # P12: Alertmanager -> hosted ntfy.sh. The topic URL (the only
          # secret) lives in the SOPS-managed 'ntfy-url' Secret, mounted at
          # /etc/alertmanager/secrets/ntfy-url/ and referenced via url_file
          # (supported since AM 0.26; this stack runs v0.33). ntfy renders
          # the Alertmanager payload natively via ?template=alertmanager
          # (verified live against ntfy.sh during P0).
          config:
            global:
              resolve_timeout: 5m
            route:
              group_by: ["namespace", "alertname"]
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 12h
              receiver: ntfy
              routes:
                - matchers: ["alertname = Watchdog"]
                  receiver: "null"
                - matchers: ["alertname = InfoInhibitor"]
                  receiver: "null"
                - matchers: ["severity = info"]
                  receiver: "null"
            inhibit_rules:
              - source_matchers: ["severity = critical"]
                target_matchers: ["severity =~ warning|info"]
                equal: ["namespace", "alertname"]
            receivers:
              - name: "null"
              - name: ntfy
                webhook_configs:
                  - url_file: /etc/alertmanager/secrets/ntfy-url/url
                    send_resolved: true
          alertmanagerSpec:
            replicas: 1
            secrets:
              - ntfy-url
        prometheus:
          # P7: nginx retired — prometheus.local served by the shared Gateway
          # (httproute-prometheus.yaml in this directory).
          ingress:
            enabled: false
          prometheusSpec:
            replicas: 1
            retention: 10d  # Keep data for 10 days
            # Select every ServiceMonitor/PodMonitor/Rule/Probe in the cluster,
            # not just ones carrying the helm release label. Removes the
            # `release: kube-prometheus-stack` label footgun for app monitors
            # (vLLM, LiteLLM, DCGM, KEDA, ...).
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            probeSelectorNilUsesHelmValues: false
        grafana:
          replicas: 1
          admin:
            # Created out-of-band (keys: admin-user / admin-password).
            # TODO(SOPS): migrate in hardening-plan Phase 2.
            existingSecret: grafana-admin
          # P11: datasources for the new observability stack. Name/uid 'loki'
          # kept stable per plan (dashboards reference the uid).
          additionalDataSources:
            - name: Loki
              uid: loki
              type: loki
              access: proxy
              url: http://loki.observability.svc.cluster.local:3100
              jsonData:
                derivedFields:
                  - name: TraceID
                    matcherRegex: "(?:trace_id|traceID)[=:\"]*(\\w+)"
                    url: "$${__value.raw}"
                    datasourceUid: tempo
            - name: Tempo
              uid: tempo
              type: tempo
              access: proxy
              url: http://tempo.observability.svc.cluster.local:3200
              jsonData:
                tracesToLogsV2:
                  datasourceUid: loki
                  spanStartTimeShift: "-5m"
                  spanEndTimeShift: "5m"
                  filterByTraceID: true
                serviceMap:
                  datasourceUid: prometheus
                nodeGraph:
                  enabled: true
          sidecar:
            datasources:
              enabled: true
            dashboards:
              enabled: true
              searchNamespace: ALL
              label: grafana_dashboard
          # P7: nginx retired — grafana.local served by the shared Gateway
          # (httproute-grafana.yaml in this directory).
          ingress:
            enabled: false
  destination:
    server: "https://kubernetes.default.svc"
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true # Automatically creates the "monitoring" namespace
      - ServerSideApply=true # Fixes "Too long" error for massive CRDs
