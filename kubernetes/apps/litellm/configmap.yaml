apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: ai-stack
data:
  config.yaml: |
    model_list:
      - model_name: qwen2.5-32b
        litellm_params:
          model: hosted_vllm/qwen2.5-32b
          # Via the KEDA interceptor (holds requests, wakes the model).
          # NOTE: config-only changes need a litellm rollout — bump the
          # teyvat.io/config-rev annotation in deployment.yaml alongside.
          api_base: http://vllm-chat-gw.ai-stack.svc.cluster.local:8080/v1
          api_key: none
          timeout: 900
      - model_name: qwen2.5-coder-32b
        litellm_params:
          model: hosted_vllm/qwen2.5-coder-32b
          api_base: http://vllm-coder-gw.ai-stack.svc.cluster.local:8080/v1
          api_key: none
          timeout: 900
      # NL->shell command generator (Qwen2.5-Coder-1.5B + LoRA fine-tune on
      # RHCSA-flavored data, redshell repo). Same KEDA scale-0/1 pattern,
      # third consumer of ousia's single GPU.
      - model_name: redshell
        litellm_params:
          model: hosted_vllm/redshell
          api_base: http://vllm-redshell-gw.ai-stack.svc.cluster.local:8080/v1
          api_key: none
          timeout: 900
      # Qwen3.8-27B (Q4_K_M GGUF) via host-level Ollama on ousia — fourth
      # consumer of the single 3090. Ollama unloads after 5m idle, so it
      # coexists with the KEDA scale-0 vLLM models (collisions possible if
      # used concurrently with them).
      - model_name: qwen3.8-27b
        litellm_params:
          model: ollama_chat/qwen3.8:27b
          api_base: http://192.168.1.215:11434
          timeout: 900
      # Embeddings via TEI (CPU, regular workers; deploys with the rag app —
      # requests 5xx harmlessly until then).
      - model_name: bge-small-en-v1.5
        litellm_params:
          model: openai/bge-small-en-v1.5
          api_base: http://tei.ai-stack.svc.cluster.local/v1
          api_key: none
      # Retrieval-augmented pipeline (rag-api wraps Qdrant + qwen3-14b).
      - model_name: teyvat-rag
        litellm_params:
          model: openai/teyvat-rag
          api_base: http://rag-api.ai-stack.svc.cluster.local:8000/v1
          api_key: none
          timeout: 900
    litellm_settings:
      num_retries: 2
      request_timeout: 900 # must survive scale-from-zero cold starts (PCIe x1)
      callbacks: ["prometheus"]
      # /metrics is cluster-internal; without this Prometheus scrapes 401
      # (v1.90.0 defaults require_auth_for_metrics_endpoint to True).
      require_auth_for_metrics_endpoint: false
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
