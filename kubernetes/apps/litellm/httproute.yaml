# P6: HTTPRoute derived 1:1 from live Ingress ai-stack/litellm-ingress (hosts + backend parity).
# Legacy Ingress stays until P7 commit 3.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: litellm
  namespace: ai-stack
spec:
  parentRefs:
    - name: teyvat-gateway
      namespace: envoy-gateway-system
  hostnames:
    - llm.local
    - llm.lan
  rules:
    - backendRefs:
        - name: litellm
          port: 80
      # Envoy's 15s default 504s cold model loads and long generations;
      # match litellm's own 900s request_timeout.
      timeouts:
        request: 900s
