# P6: HTTPRoute derived 1:1 from live Ingress default/komga-ingress (hosts + backend parity).
# Legacy Ingress stays until P7 commit 3.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: komga
  namespace: default
spec:
  parentRefs:
    - name: teyvat-gateway
      namespace: envoy-gateway-system
  hostnames:
    - komga.local
    - komga.lan
  rules:
    - backendRefs:
        - name: komga
          port: 80
