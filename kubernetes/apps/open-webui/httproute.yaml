# P6: HTTPRoute derived 1:1 from live Ingress ai-stack/open-webui-ingress (hosts + backend parity).
# Legacy Ingress stays until P7 commit 3.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: open-webui
  namespace: ai-stack
spec:
  parentRefs:
    - name: teyvat-gateway
      namespace: envoy-gateway-system
  hostnames:
    - ai.local
    - ai.lan
  rules:
    - backendRefs:
        - name: open-webui
          port: 80
      # Envoy's 15s default cuts long streamed chats; match litellm 900s.
      timeouts:
        request: 900s
