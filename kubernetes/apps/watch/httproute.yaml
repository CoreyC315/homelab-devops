# LAN + Tailscale only (Gateway is on the MetalLB LAN IP; no public exposure).
# Video is streamed with HTTP Range from a mounted file — no transcoding. Long request timeout
# so large files don't hit Envoy's 15s default (see jellyfin-remote-bitrate-envoy-timeout).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: watch
  namespace: default
spec:
  parentRefs:
    - name: teyvat-gateway
      namespace: envoy-gateway-system
  hostnames:
    - watch.lan
    - watch.local
  rules:
    - backendRefs:
        - name: watch
          port: 80
      timeouts:
        request: 3600s
