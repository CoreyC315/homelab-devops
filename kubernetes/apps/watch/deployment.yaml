# Source: apps/watch/ (FastAPI + ffmpeg). Image built --platform linux/amd64 and pushed to Docker Hub.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: watch
  namespace: default
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: watch
  template:
    metadata:
      labels:
        app: watch
    spec:
      securityContext:
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: watch
          image: starrider315/watch:0.2.0
          securityContext:
            runAsUser: 1026 # starrider315 on the Synology
            runAsGroup: 100
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          env:
            - name: MEDIA_DIR
              value: /media
            - name: CACHE_DIR
              value: /cache
            # Background job: rewrites non-h264/AAC files (phones play mp3-in-mp4 silently) to h264+AAC mp4,
            # replacing the original only after the output verifies. Set "false" to disable.
            - name: AUTO_CONVERT
              value: "true"
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "2" # caps ffmpeg re-encodes so they can't starve the node
              memory: 1536Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: media
              mountPath: /media
            - name: cache
              mountPath: /cache
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: watch-media-nfs
        - name: cache
          persistentVolumeClaim:
            claimName: watch-cache-pvc
