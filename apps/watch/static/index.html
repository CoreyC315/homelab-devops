<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Watch</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --fg:#e8eaed; --mut:#8b93a1; --acc:#6aa3ff; --bad:#ff6b6b; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.4 system-ui,-apple-system,sans-serif;
         padding-bottom: env(safe-area-inset-bottom); }
  header { position:sticky; top:0; z-index:5; background:var(--bg); padding:10px 12px 0;
           border-bottom:1px solid #20242d; }
  .bar { display:flex; gap:8px; margin-bottom:8px; }
  input[type=search] { flex:1; min-width:0; background:var(--card); border:1px solid #262b36; color:var(--fg);
                       border-radius:10px; padding:9px 12px; font-size:16px; }
  .tabs { display:flex; gap:6px; overflow-x:auto; padding-bottom:10px; scrollbar-width:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tab { flex:none; background:var(--card); color:var(--mut); border:1px solid #262b36; border-radius:999px;
         padding:6px 14px; font-size:14px; cursor:pointer; }
  .tab.on { background:var(--acc); color:#0b1020; border-color:var(--acc); font-weight:600; }
  .tab small { opacity:.7; margin-left:4px; }
  main { padding:12px; display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); }
  .card { background:var(--card); border-radius:12px; overflow:hidden; cursor:pointer; }
  .th { position:relative; aspect-ratio:16/10; background:#0b0d11; }
  .th img { width:100%; height:100%; object-fit:cover; display:block; }
  .dur { position:absolute; right:6px; bottom:6px; background:rgba(0,0,0,.75); border-radius:6px;
         padding:1px 6px; font-size:12px; }
  .warn { position:absolute; left:6px; top:6px; background:#c77d00; border-radius:6px; padding:1px 6px; font-size:11px; }
  .ph { position:absolute; inset:0; display:grid; place-items:center; color:var(--mut); font-size:12px; }
  .meta { padding:8px 10px 10px; }
  .name { font-size:13px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; word-break:break-word; }
  .sub { color:var(--mut); font-size:12px; margin-top:3px; }
  .empty { grid-column:1/-1; text-align:center; color:var(--mut); padding:60px 0; }
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.94); z-index:20; display:none; flex-direction:column; }
  #modal.on { display:flex; }
  #modal .top { display:flex; align-items:center; gap:8px; padding:10px 12px; padding-top:max(10px,env(safe-area-inset-top)); }
  #modal .t { flex:1; min-width:0; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  button { border:0; border-radius:10px; padding:9px 14px; font-size:14px; cursor:pointer; background:#262b36; color:var(--fg); }
  button.del { background:var(--bad); color:#1a0505; font-weight:600; }
  video { flex:1; min-height:0; width:100%; background:#000; }
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#262b36; padding:10px 16px;
           border-radius:10px; display:none; z-index:30; }
</style>
</head>
<body>
<header>
  <div class="bar"><input id="q" type="search" placeholder="Search videos…" autocomplete="off"></div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="grid"></main>
<div id="modal">
  <div class="top">
    <button id="close">✕ Close</button>
    <div class="t" id="mtitle"></div>
    <button class="del" id="del">Delete</button>
  </div>
  <video id="player" controls playsinline autoplay></video>
</div>
<div id="toast"></div>
<script>
const $ = s => document.querySelector(s);
let data = { items: [], folders: [], unsorted: 0, total: 0 }, cur = "__all", current = null, retry = 0, timer = null;

const fmtDur = s => { if (!s) return ""; s = Math.round(s); const h = s/3600|0, m = (s%3600)/60|0, x = s%60;
  return (h ? h+":"+String(m).padStart(2,"0") : m) + ":" + String(x).padStart(2,"0"); };
const fmtSize = b => b > 1e9 ? (b/1e9).toFixed(1)+" GB" : (b/1e6).toFixed(0)+" MB";
const ago = t => { const d = (Date.now()/1000 - t)/86400; return d < 1 ? "today" : d < 2 ? "yesterday" : Math.floor(d)+"d ago"; };
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const toast = m => { const t = $("#toast"); t.textContent = m; t.style.display = "block"; setTimeout(() => t.style.display = "none", 2200); };

async function load() {
  const r = await fetch("/api/videos"); data = await r.json(); render();
  clearTimeout(timer);
  if (data.items.some(i => !i.ready) && retry++ < 40) timer = setTimeout(load, 4000); else retry = 0;
}

function render() {
  const tabs = [["__all", "All", data.total]];
  if (data.unsorted) tabs.push(["", "Unsorted", data.unsorted]);
  data.folders.forEach(f => tabs.push([f.name, f.name, f.count]));
  if (!tabs.some(t => t[0] === cur)) cur = "__all";
  $("#tabs").innerHTML = tabs.map(([k, l, n]) =>
    `<div class="tab ${k === cur ? "on" : ""}" data-k="${esc(k)}">${esc(l)}<small>${n}</small></div>`).join("");
  const q = $("#q").value.trim().toLowerCase();
  const list = data.items.filter(i => (cur === "__all" || i.folder === cur) && (!q || i.name.toLowerCase().includes(q)));
  $("#grid").innerHTML = list.length ? list.map(i => `
    <div class="card" data-p="${esc(i.path)}">
      <div class="th">${i.ready ? `<img loading="lazy" src="/thumb?path=${encodeURIComponent(i.path)}">` : `<div class="ph">generating…</div>`}
        ${i.duration ? `<span class="dur">${fmtDur(i.duration)}</span>` : ""}
        ${i.compat === false ? `<span class="warn" title="May not play in this browser">${esc(i.codec)}</span>` : ""}</div>
      <div class="meta"><div class="name">${esc(i.name)}</div>
        <div class="sub">${fmtSize(i.size)} · ${ago(i.mtime)}</div></div></div>`).join("")
    : `<div class="empty">No videos here yet.</div>`;
}

$("#tabs").onclick = e => { const t = e.target.closest(".tab"); if (t) { cur = t.dataset.k; render(); scrollTo(0, 0); } };
$("#q").oninput = render;
$("#grid").onclick = e => { const c = e.target.closest(".card"); if (c) open(data.items.find(i => i.path === c.dataset.p)); };

function open(i) {
  current = i; $("#mtitle").textContent = i.name;
  const v = $("#player"); v.src = "/video?path=" + encodeURIComponent(i.path); $("#modal").classList.add("on"); v.play().catch(() => {});
}
function closeModal() { const v = $("#player"); v.pause(); v.removeAttribute("src"); v.load(); $("#modal").classList.remove("on"); current = null; }
$("#close").onclick = closeModal;
addEventListener("keydown", e => { if (e.key === "Escape" && current) closeModal(); });
$("#del").onclick = async () => {
  if (!current || !confirm(`Delete permanently?\n\n${current.name}`)) return;
  const p = current.path; closeModal();
  const r = await fetch("/api/videos?path=" + encodeURIComponent(p), { method: "DELETE" });
  toast(r.ok ? "Deleted" : "Delete failed"); load();
};
load();
</script>
</body>
</html>
